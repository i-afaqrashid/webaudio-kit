<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webaudio-kit social preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #111511;
      }

      .preview {
        align-items: center;
        background: #f5f6ef;
        display: grid;
        grid-template-columns: 1fr 320px;
        height: 630px;
        margin: 0;
        padding: 72px;
        width: 1200px;
      }

      .preview h1 {
        font-size: 74px;
        max-width: 820px;
      }

      .previewIcon {
        height: 260px;
        width: 260px;
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <section>
        <div class="kicker">webaudio-kit</div>
        <h1>React hooks for browser tones, sweeps, and analyser UI.</h1>
      </section>
      <img class="previewIcon" src="icon.svg" alt="" />
    </main>
  </body>
</html>
