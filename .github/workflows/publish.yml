name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    if: github.repository == 'i-afaqrashid/webaudio-kit'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          npm install --global pnpm@10.33.4
          pnpm --version

      - name: Tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm release:verify-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify workspace
        run: pnpm verify

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Smoke packaged packages
        run: pnpm smoke:pack -- --skip-build

      - name: Build standalone examples
        run: pnpm examples:check -- --skip-build

      - name: Pack packages
        run: |
          rm -rf .release-packages
          mkdir -p .release-packages
          pnpm -r --filter './packages/*' pack --pack-destination .release-packages

      - name: Publish packages
        run: pnpm release:publish-tarballs .release-packages

      - name: Build GitHub release notes
        run: pnpm release:notes "${GITHUB_REF_NAME}" > .release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title="webaudio-kit ${GITHUB_REF_NAME}"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${release_title}" \
              --notes-file .release-notes.md
            gh release upload "${GITHUB_REF_NAME}" .release-packages/*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" .release-packages/*.tgz \
              --title "${release_title}" \
              --notes-file .release-notes.md \
              --verify-tag
          fi
