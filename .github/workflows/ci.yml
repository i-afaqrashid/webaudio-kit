name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19, 22, 24]
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        run: |
          npm install --global pnpm@10.33.4
          pnpm --version

      - name: Prepare pnpm store
        run: |
          PNPM_STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@v5.0.5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-quality-node-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-quality-node-${{ matrix.node-version }}-
            ${{ runner.os }}-pnpm-quality-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19

      - name: Setup pnpm
        run: |
          npm install --global pnpm@10.33.4
          pnpm --version

      - name: Prepare pnpm store
        run: |
          PNPM_STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@v5.0.5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-build-node-20.19-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-build-node-20.19-
            ${{ runner.os }}-pnpm-build-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Next.js build
        uses: actions/cache@v5.0.5
        with:
          path: apps/site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/site/**/*.js', 'apps/site/**/*.jsx', 'apps/site/**/*.ts', 'apps/site/**/*.tsx', 'apps/site/**/*.css', 'apps/site/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build packages
        run: pnpm build

      - name: Build demo
        run: pnpm demo:build

      - name: Build site
        run: pnpm site:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run site browser QA
        run: pnpm site:qa

      - name: Smoke packaged packages
        run: pnpm smoke:pack -- --skip-build

      - name: Build standalone examples
        run: pnpm examples:check -- --skip-build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20.19

      - name: Setup pnpm
        run: |
          npm install --global pnpm@10.33.4
          pnpm --version

      - name: Prepare pnpm store
        run: |
          PNPM_STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$PNPM_STORE_PATH"
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@v5.0.5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-audit-node-20.19-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-audit-node-20.19-
            ${{ runner.os }}-pnpm-audit-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
